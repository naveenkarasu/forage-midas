# Use the same topic key the listener will read
general.kafka-topic=midas-task-topic

# Basic Kafka consumer config for tests (embedded Kafka supplies bootstrap servers)
spring.kafka.consumer.group-id=midas-core
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Security for test deserialization
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Tell JsonDeserializer which class to create from JSON
# >>> REPLACE the value below with the FULLY QUALIFIED NAME of the provided Transaction class <<<
spring.kafka.consumer.properties.spring.json.value.default.type=com.jpmc.midascore.foundation.Transaction
# (optional but helps if tests don?t set type headers)
spring.kafka.consumer.properties.spring.json.use.type.headers=false# --- PRODUCER (for tests) ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Rely on the consumer's default.type instead of type headers (keeps things consistent)
spring.kafka.producer.properties.spring.json.add.type.headers=false
# --- H2 in-memory DB for tests ---
spring.datasource.url=jdbc:h2:mem:midas;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Optional: H2 console if you want to peek
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


